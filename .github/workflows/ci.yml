name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v
      # En Windows además comprobamos que las declaraciones ctypes de la API Win32 cargan.
      - if: runner.os == 'Windows'
        run: python -c "from recuperador.sources import list_optical_drives; print(list_optical_drives())"

  build-exe:
    name: Ejecutable Windows
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --noconsole --name RecuperadorCDDVD main.py
      - uses: actions/upload-artifact@v4
        with:
          name: RecuperadorCDDVD-windows
          path: dist/RecuperadorCDDVD.exe
      # Al publicar una etiqueta vX.Y.Z, el .exe se adjunta automáticamente a la release.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RecuperadorCDDVD.exe
          generate_release_notes: true
